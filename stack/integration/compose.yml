# The denser integration site: blog + wallet at the tip of aidev/integration, laid
# out the way hive/haf_api_node's `ui` profile deploys denser on API nodes
# (ui.yaml): the `-subdirectory` images, blog at /blog and wallet at /wallet on one
# hostname. It is to denser what discuss.syncad.com is to ratings.
#
# This file alone runs the published `-subdirectory` images (DENSER_MODE=images).
# The site's default is follow mode: compose.follow.yml on top serves blog and
# wallet from production builds of this checkout, which upgrade.sh, run every 2
# minutes by the systemd timer, fast-forwards and rebuilds where the code changed.
# The Hive API is a public node (networks/), not a local HAF.
#
# Run from a checkout of this repository on aidev/integration, in
# stack/integration, with a .env made from .env.example. See README.md.
name: ${COMPOSE_PROJECT_NAME:-denser-integration}

x-app: &app
  restart: unless-stopped
  env_file:
    # mainnet (default) or mirrornet: the API node, chain id and AI search domain.
    - networks/${DENSER_NETWORK:-mainnet}.env
  environment: &app-env
    PORT: "80"
    HOSTNAME: 0.0.0.0
    REACT_APP_SITE_DOMAIN: https://${SITE_HOST}/blog
    REACT_APP_BLOG_DOMAIN: https://${SITE_HOST}/blog
    REACT_APP_WALLET_ENDPOINT: https://${SITE_HOST}/wallet
    REACT_APP_SSR_HOST: https://${SITE_HOST}
    REACT_APP_IMAGES_ENDPOINT: https://images.hive.blog/
    REACT_APP_EXPLORER_DOMAIN: https://explore.openhive.network
    REACT_APP_LOGGING_BROWSER_ENABLED: "true"
    REACT_APP_LOGGING_LOG_LEVEL: info
    DENSER_SERVER_SECRET_COOKIE_PASSWORD: ${DENSER_SERVER_SECRET_COOKIE_PASSWORD:?set it in .env (32+ random characters)}
    # One prefix for blog and wallet: on one origin they then share one server session (sign-in,
    # accounts, switches, sign-out). Unset, each app keeps its own (`blog_session`, `wallet_session`).
    DENSER_SERVER_SESSION_COOKIE_PREFIX: ${DENSER_SERVER_SESSION_COOKIE_PREFIX:-denser_}
    # Google Drive sign-in (optional): a Google OAuth web client whose authorized
    # JavaScript origin is https://${SITE_HOST}. Empty leaves the method disabled.
    REACT_APP_GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
    GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
    # Chat (optional): CHAT_PROVIDER=matrix chats on ../matrix's Synapse instead of openhive.chat
    REACT_APP_CHAT_PROVIDER: ${CHAT_PROVIDER:-}
    REACT_APP_MATRIX_ELEMENT_URL: ${MATRIX_ELEMENT_URL:-}
    REACT_APP_MATRIX_HOMESERVER_URL: ${MATRIX_HOMESERVER_URL:-}
    # The room the drawer opens in (default: #general of the homeserver)
    REACT_APP_MATRIX_DEFAULT_ROOM: ${MATRIX_DEFAULT_ROOM:-}
    # The drawer's client: native (default; signs in with the admin token's login tokens) or element
    REACT_APP_MATRIX_CHAT_CLIENT: ${MATRIX_CHAT_CLIENT:-}
    # A Synapse admin's access token: sign-out and account switches delete the user's Matrix devices. Empty: never.
    DENSER_SERVER_MATRIX_ADMIN_TOKEN: ${DENSER_SERVER_MATRIX_ADMIN_TOKEN:-}
    # yes: sign-ins authenticate on the server, needed for Matrix chat and OAuth (see ../matrix/README.md)
    REACT_APP_LOGIN_AUTHENTICATE_ON_BACKEND: ${LOGIN_AUTHENTICATE_ON_BACKEND:-}
    # Hivemind REST nodes serving /hivemind-api (space- or comma-separated): feeds, profiles,
    # communities and follows are read over REST GETs. Empty: JSON-RPC only.
    REACT_APP_HIVEMIND_REST_NODES: ${HIVEMIND_REST_NODES:-}

services:
  blog:
    <<: *app
    image: registry.gitlab.syncad.com/hive/denser/blog-subdirectory:${DENSER_TAG:-integration}
    environment:
      <<: *app-env
      REACT_APP_APP_NAME: blog
      REACT_APP_BASE_PATH: /blog
      NODE_OPTIONS: --max-old-space-size=3072
      # The haf_fyp API (e.g. https://api.syncad.com/haf-fyp-api) turns on the For You feed. Empty: off.
      REACT_APP_FYP_API_URL: ${FYP_API_URL:-}
      # Registers the `denser` OAuth client ("Sign in with Denser" for openhive.chat).
      DENSER_SERVER_OAUTH_OPENHIVE_CHAT_SECRET: ${DENSER_SERVER_OAUTH_OPENHIVE_CHAT_SECRET:?set it in .env (32+ random characters)}
      # Registers the `matrix` OAuth client (Synapse's "Continue with Hive (denser)"), with MATRIX_HOMESERVER_URL.
      DENSER_SERVER_OAUTH_MATRIX_SECRET: ${DENSER_SERVER_OAUTH_MATRIX_SECRET:-}
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(process.argv[1],{redirect:'manual'}).then(r=>process.exit(r.status<400?0:1),()=>process.exit(1))", "http://127.0.0.1:80/blog"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  wallet:
    <<: *app
    image: registry.gitlab.syncad.com/hive/denser/wallet-subdirectory:${DENSER_TAG:-integration}
    environment:
      <<: *app-env
      REACT_APP_APP_NAME: wallet
      REACT_APP_BASE_PATH: /wallet
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(process.argv[1],{redirect:'manual'}).then(r=>process.exit(r.status<400?0:1),()=>process.exit(1))", "http://127.0.0.1:80/wallet"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  caddy:
    # Caddy with the cloudflare DNS provider (DNS-01 certificates for names the
    # internet can't reach) and the PROXY-protocol listener (behind sites-router).
    image: registry.gitlab.syncad.com/peerverity/ratings-stack/caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on: [blog, wallet]
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    environment:
      # The config caddy runs, and caddy-apply.sh validates and reloads.
      DENSER_CADDYFILE: /etc/caddy/Caddyfile
      SITE_HOST: ${SITE_HOST}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?the Cloudflare token for the hostname's zone}
      CADDY_PROXY_PROTOCOL_ALLOW: ${CADDY_PROXY_PROTOCOL_ALLOW:-127.0.0.1/32}
    command: [sh, -c, 'exec caddy run --config "$$DENSER_CADDYFILE" --adapter caddyfile']
    volumes:
      # The directory, not each file: git replaces a changed file with a new one,
      # which a single-file mount would never show. caddy-apply.sh loads it.
      - ./caddy:/etc/caddy:ro
      - ./status:/srv/status:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, sites]

networks:
  # The host's sites-router network (~/sites-router on predicate-testing). Set
  # PROXY_NETWORK to an existing network on a host without one.
  sites:
    external: true
    name: ${PROXY_NETWORK:-sites}

volumes:
  caddy_data:
  caddy_config:

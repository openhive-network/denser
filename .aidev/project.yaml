# Profile for hive/denser, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: denser

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/denser"
  id: 399

# AIDEV integrates into its own branch and hands it off to develop by merge
# request (`aidev handoff denser --session <name>`); develop is protected,
# fast-forward only and needs a green pipeline. develop is the development
# branch, not the release: main is denser's release, synced from develop by
# people. AIDEV never pushes develop or main, so `stable` is omitted.
branches:
  integration: "aidev/integration"
  handoff: "develop"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/denser/aidev-tests@sha256:dcc8e87a4bf2c95fe19084f514830f3fb511cc7f825fe00a0a61ebd3d9a37a57"
  inputs: ["pnpm-lock.yaml"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Every suite runs in the image above, offline; each
# writes junit under test-results/, the per-test evidence AIDEV records.
# AIDEV does not run the `static` or `system` slots for a project, so the static
# checks (ESLint errors, tsc for both apps) are a suite of quick, full and canary.
#
# The live-API Playwright suites (apps/*/playwright/tests/e2e, smoke) judge
# mainnet data rather than the change and are the flaky part of denser's CI, so
# they never gate: the e2e specs a candidate changes run only as full's advisory
# live_e2e suite, and smoke is not bound. Not bound either: mirrornet needs a HAF
# stack.

# Adaptive per-action test timeouts (ai/aidev#15386). aidev resolves each named
# action from its recorded durations and the host's load, and hands the result to
# every suite in AIDEV_TIMEOUTS_FILE. playwright/support/timeouts.ts (#1103) reads
# it, never goes below the static default, and appends completed durations to
# AIDEV_TIMEOUTS_OBSERVATIONS. Without the file (local runs, plain CI) every
# timeout is its static default.
timeouts:
  enabled: true
  max_scale: 3
verification:
  # ~25 s: mocha unit suites of packages/renderer and packages/transaction
  # (~1,430 tests), plus lint and type check.
  quick:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
  # quick, plus a production build of the blog and its fixture-replay Playwright
  # suite (fixture_e2e: recorded API responses, one worker), the wallet's build and
  # fixture suite (wallet_fixture), the dev stack boot check, then the advisory
  # live_e2e against those blog and wallet builds served by the test stack.
  full:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
      - name: fixture_e2e
        adapter: command
        args: [".aidev/run-fixture-e2e.sh"]
        artifacts: ["test-results/fixture/"]
        stack: false
      # The wallet's fixture suite, split out of fixture_e2e on 2026-10-09 so a slow
      # blog pass on a loaded host cannot use up its wall (denser#1093, #799).
      - name: wallet_fixture
        adapter: command
        args: [".aidev/run-wallet-fixture-e2e.sh"]
        artifacts: ["test-results/wallet-fixture/"]
        stack: false
      # Boots the live dev stack (sandbox.dev) cold and over the base revision's
      # node_modules, when the candidate changes its dependencies, next.config,
      # middleware or the stack's own files; "not applicable" otherwise. It runs
      # its own compose projects, so it needs a docker daemon: under AIDEV's
      # `--network none` container it reports a skipped case saying it could not
      # run. See .aidev/run-dev-stack.sh.
      - name: dev_stack
        adapter: command
        args: [".aidev/run-dev-stack.sh"]
        artifacts: ["test-results/dev-stack-suite/"]
        stack: false
      # ADVISORY (always exits 0): the live-API e2e specs this candidate changed
      # or reaches through a changed import, plus the app's smoke specs when app
      # source changed, against the stack's blog-live (fixture_e2e's build) and
      # wallet-live (wallet_fixture's);
      # "not applicable" when it selects none or no change information reaches
      # the container. See .aidev/run-live-e2e.sh.
      - name: live_e2e
        adapter: command
        args: [".aidev/run-live-e2e.sh"]
        artifacts: ["test-results/live-e2e/"]
        env: {DENSER_TEST_STACK: "1"}
  baseline:
    adapter: command
    args: [".aidev/run-unit-tests.sh"]
    artifacts: ["test-results/unit/"]
    stack: false
  # Re-checks the merged tree on deploy/promote.
  canary:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
  # The unit suites under nyc (renderer's own dev dependency): per-package
  # Cobertura + text summary and junit in test-results/coverage/.
  coverage:
    adapter: command
    args: [".aidev/run-coverage.sh"]
    artifacts: ["test-results/coverage/"]
    stack: false
  # The deterministic Lighthouse pass (.aidev/run-lighthouse-fixture.sh): production
  # builds of blog and wallet behind one origin, recorded Hive API and image data, no
  # network; the integration check's routes and medians, compared with the committed
  # baseline (.aidev/lighthouse-fixture/baseline.json). Bound to `system` because the
  # slot names are AIDEV's fixed vocabulary (there is no `perf`) and no phase requests
  # `system` for a project: it gates nothing and runs only as
  # `aidev test run --slot system`. ~5 min with next's build cache warm.
  system:
    suites:
      - name: lighthouse_fixture
        adapter: command
        args: [".aidev/run-lighthouse-fixture.sh"]
        artifacts: ["test-results/lighthouse-fixture/"]
        stack: false

# Live dev stack (#966): `next dev` of the blog and the wallet, hot-reloading from
# the implement checkout, against the fixture replay proxy — from the pinned image
# above (and caddy for the edge), with no image build. The blog answers at
# $DENSER_DEV_BLOG_URL, and both apps at $DENSER_DEV_UI_URL (the blog at the root,
# the wallet under /wallet); an agent runs fixture specs with
# .aidev/dev-stack-spec.sh; see .aidev/README.md.
# Measured on steem-17: 64 s to healthy with no node_modules (the offline install
# is ~7 s of it), 57 s warm; most of it is next dev compiling the warmed routes.
# The wallet's next dev starts on its first request: booted together, the two
# cold compiles peaked at 6.2 GiB, past the default 5.5g `memory`; started
# lazily the stack peaked at 4.6 GiB (steem-3, 2026-10-14; .aidev/README.md).
# Shared test stack (#967): fixture_e2e's and wallet_fixture's production builds
# served against the live Hive API, for the advisory live_e2e only
# (.aidev/test-stack.compose.yml).
# fixture_e2e itself stays self-contained: its fixture proxy is per spec, inside
# the Playwright process (see .aidev/run-fixture-e2e.sh). Only live_e2e declares
# `stack: true`; every other binding says `stack: false`.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # One Next.js server per app (2 GB limit each): light, up to four per host. As heavy (#967) it
  # took the host's only heavy slot, shared with ratings, and a full run that landed
  # on a host already holding it waited 15 min, then failed without running a suite.
  resource_class: light
  services: [blog-live, wallet-live]
  # Copying a standalone build and starting its server takes ~10 s.
  readiness_timeout: 300
  dev:
    compose: .aidev/dev-stack.compose.yml
    services: [init, fixture-proxy, blog, blog-ready, wallet, wallet-ready, edge]
    readiness_timeout: 600
    ports: [BLOG, FIXTURE, UI]
    # What `aidev session devstack <name> open` forwards to a person's machine: the
    # edge, with the blog at / and the wallet at /wallet.
    ui: {port: UI, path: /}
    env:
      DENSER_DEV_BLOG_URL: http://127.0.0.1:${AIDEV_PORT_BLOG}
      DENSER_DEV_UI_URL: http://127.0.0.1:${AIDEV_PORT_UI}/
      DENSER_DEV_FIXTURE_URL: http://127.0.0.1:${AIDEV_PORT_FIXTURE}
      DENSER_DEV_STACK_PROJECT: ${AIDEV_DEV_STACK_PROJECT}
      DENSER_DEV_CHECKOUT: ${AIDEV_HOST_CHECKOUT}
    reload:
      # A dependency change needs node_modules reinstalled (offline, from the
      # image's store) and next restarted; restarting reruns .aidev/pnpm-deps.sh,
      # which installs only when the lockfile moved. No image is rebuilt: a
      # lockfile the image's store cannot satisfy needs a new environment.image.
      - paths: ["pnpm-lock.yaml", "package.json", "apps/*/package.json", "packages/*/package.json"]
        action: restart
      # next.config.js and the env/middleware wiring are read once at startup.
      - paths: ["apps/blog/next.config.js", "apps/wallet/next.config.js", "packages/middleware/**", ".aidev/dev-stack.compose.yml", ".aidev/dev-stack.Caddyfile", ".aidev/fixture-proxy-serve.mjs", ".aidev/blog-serve-dev.sh"]
        action: restart

# No publish: section. The integration site (stack/integration,
# https://denser.discuss.peerverity.info) runs in follow mode: it builds
# aidev/integration from source and rebuilds only the apps a commit changes
# (#1056), so promotes build no images. Production images still come from
# develop/main through GitLab CI; hive/haf_api_node's `ui` profile pulls those
# version tags, not `:integration`. Re-adding a publish: section with an
# `integration` channel brings back per-promote images for DENSER_MODE=images.

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []

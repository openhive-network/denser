# Profile for hive/denser, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: denser

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/denser"
  id: 399

# AIDEV integrates into its own branch; people merge it into develop through
# merge requests, so `stable` is omitted and `aidev release` never moves
# develop or main.
branches:
  integration: "aidev/integration"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/denser/aidev-tests@sha256:6aeedc1e9b3c8a5c2b270e7ac99f8c1bc6a91b0cdfa689fe99f36bb7c9c3c8fd"
  inputs: ["pnpm-lock.yaml"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Every suite runs in the image above, offline; each
# writes junit under test-results/, the per-test evidence AIDEV records.
# AIDEV does not run the `static` or `system` slots for a project, so the static
# checks (ESLint errors, tsc for both apps) are a suite of quick, full and canary.
#
# The live-API Playwright suites (apps/*/playwright/tests/e2e, smoke) judge
# mainnet data rather than the change and are the flaky part of denser's CI, so
# they never gate: the e2e specs a candidate changes run only as full's advisory
# live_e2e suite, and smoke is not bound. Not bound either: mirrornet needs a HAF
# stack; translation checks (lint:translations*) fail on existing debt.
verification:
  # ~25 s: mocha unit suites of packages/renderer and packages/transaction
  # (~1,430 tests), plus lint and type check.
  quick:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
  # quick, plus a production build of the blog and its fixture-replay Playwright
  # suite (~250 tests against recorded API responses, one worker), the dev stack
  # boot check, then the advisory live_e2e against that build served by the test
  # stack.
  full:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
      - name: fixture_e2e
        adapter: command
        args: [".aidev/run-fixture-e2e.sh"]
        artifacts: ["test-results/fixture/"]
        stack: false
      # Boots the live dev stack (sandbox.dev) cold and over the base revision's
      # node_modules, when the candidate changes its dependencies, next.config,
      # middleware or the stack's own files; "not applicable" otherwise. It runs
      # its own compose projects, so it needs a docker daemon: under AIDEV's
      # `--network none` container it reports a skipped case saying it could not
      # run. See .aidev/run-dev-stack.sh.
      - name: dev_stack
        adapter: command
        args: [".aidev/run-dev-stack.sh"]
        artifacts: ["test-results/dev-stack-suite/"]
        stack: false
      # ADVISORY (always exits 0): the live-API e2e specs this candidate changed,
      # --repeat-each=3, against the stack's blog-live (fixture_e2e's build);
      # "not applicable" when it changes none or no change information reaches
      # the container (ai/aidev#14456). See .aidev/run-live-e2e.sh.
      - name: live_e2e
        adapter: command
        args: [".aidev/run-live-e2e.sh"]
        artifacts: ["test-results/live-e2e/"]
        env: {DENSER_TEST_STACK: "1"}
  baseline:
    adapter: command
    args: [".aidev/run-unit-tests.sh"]
    artifacts: ["test-results/unit/"]
    stack: false
  # Re-checks the merged tree on deploy/promote.
  canary:
    suites:
      - name: unit
        adapter: command
        args: [".aidev/run-unit-tests.sh"]
        artifacts: ["test-results/unit/"]
        stack: false
      - name: static
        adapter: command
        args: [".aidev/run-static.sh"]
        stack: false
  # The unit suites under nyc (renderer's own dev dependency): per-package
  # Cobertura + text summary and junit in test-results/coverage/.
  coverage:
    adapter: command
    args: [".aidev/run-coverage.sh"]
    artifacts: ["test-results/coverage/"]
    stack: false

# Live dev stack (#966): `next dev` of the blog, hot-reloading from the implement
# checkout, against the fixture replay proxy — from the pinned image above, with
# no image build. An agent opens pages at $DENSER_DEV_BLOG_URL and runs fixture
# specs with .aidev/dev-stack-spec.sh; see .aidev/README.md.
# Measured on steem-17: 64 s to healthy with no node_modules (the offline install
# is ~7 s of it), 57 s warm; most of it is next dev compiling the warmed routes.
# Shared test stack (#967): fixture_e2e's production build served against the
# live Hive API, for the advisory live_e2e only (.aidev/test-stack.compose.yml).
# fixture_e2e itself stays self-contained: its fixture proxy is per spec, inside
# the Playwright process (see .aidev/run-fixture-e2e.sh). Only live_e2e declares
# `stack: true`; every other binding says `stack: false`.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # One Next.js server (2 GB limit); heavy as #967 asks, one copy per host.
  resource_class: heavy
  services: [blog-live]
  # Copying the standalone build and starting the server takes ~10 s.
  readiness_timeout: 300
  dev:
    compose: .aidev/dev-stack.compose.yml
    services: [init, fixture-proxy, blog, blog-ready]
    readiness_timeout: 600
    ports: [BLOG, FIXTURE]
    env:
      DENSER_DEV_BLOG_URL: http://127.0.0.1:${AIDEV_PORT_BLOG}
      DENSER_DEV_FIXTURE_URL: http://127.0.0.1:${AIDEV_PORT_FIXTURE}
      DENSER_DEV_STACK_PROJECT: ${AIDEV_DEV_STACK_PROJECT}
      DENSER_DEV_CHECKOUT: ${AIDEV_HOST_CHECKOUT}
    reload:
      # A dependency change needs node_modules reinstalled (offline, from the
      # image's store) and next restarted; restarting reruns .aidev/pnpm-deps.sh,
      # which installs only when the lockfile moved. No image is rebuilt: a
      # lockfile the image's store cannot satisfy needs a new environment.image.
      - paths: ["pnpm-lock.yaml", "package.json", "apps/*/package.json", "packages/*/package.json"]
        action: restart
      # next.config.js and the env/middleware wiring are read once at startup.
      - paths: ["apps/blog/next.config.js", "packages/middleware/**", ".aidev/dev-stack.compose.yml", ".aidev/fixture-proxy-serve.mjs"]
        action: restart

# Capability grants for target-side code. Empty until this project needs one.
# The integration site (stack/integration, https://denser.discuss.peerverity.info):
# each promote landing on aidev/integration builds the images hive/haf_api_node's
# `ui` profile runs (blog at /blog, wallet at /wallet), pushes `:<sha8>` and moves
# `:integration`; the site's 5-minute upgrade timer follows that tag. No GitLab CI
# is involved. No stable channel: production images still come from develop/main
# through CI.
publish:
  images:
    - name: blog-subdirectory
      repository: registry.gitlab.syncad.com/hive/denser/blog-subdirectory
      dockerfile: Dockerfile
      context: .
      args:
        TURBO_APP_SCOPE: "@hive/blog"
        TURBO_APP_PATH: /apps/blog
        TURBO_APP_NAME: blog-subdirectory
        BASE_PATH: /blog
        GIT_CURRENT_BRANCH: ${AIDEV_COMMIT_BRANCH}
        GIT_COMMIT_SHA: ${AIDEV_COMMIT_SHA}
      build_args: [NPM_CONFIG_REGISTRY]
    - name: wallet-subdirectory
      repository: registry.gitlab.syncad.com/hive/denser/wallet-subdirectory
      dockerfile: Dockerfile
      context: .
      args:
        TURBO_APP_SCOPE: "@hive/wallet"
        TURBO_APP_PATH: /apps/wallet
        TURBO_APP_NAME: wallet-subdirectory
        BASE_PATH: /wallet
        GIT_CURRENT_BRANCH: ${AIDEV_COMMIT_BRANCH}
        GIT_COMMIT_SHA: ${AIDEV_COMMIT_SHA}
      build_args: [NPM_CONFIG_REGISTRY]
  channels:
    integration: integration
  # A key, never a value: resolved from the denser project secrets
  # AIDEV_PROJECT_SECRET_PUBLISH_DENSER_REGISTRY_REGISTRY_USER / _TOKEN
  # (hive/denser deploy token 74, read/write_registry).
  credentials: denser-registry

capabilities: []

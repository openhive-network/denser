<!doctype html>
<!--
  Served from Element's origin, where Element keeps its session. denser's chat widget loads it
  first, as /denser-session.html?user=<Matrix user id>&idp=<Synapse IdP id>[&room=<alias or ID>]
  [&theme=light|dark][&parent=<denser's origin>]. With a theme, it sets that theme in Element's
  device settings first, in both cases below, so Element shows denser's theme.
  - Element holds that user's session: continue into Element, in the room when one is given.
  - Otherwise: clear Element's storage (another user's session), remember the homeserver for
    Element's token login, and ask the parent page (denser's widget) for a login token, posting
    {type: 'denser-matrix-login-token-request', user} to the parent origin. The widget answers to
    Element's origin with {type: 'denser-matrix-login-token', loginToken} (null for none), minted
    by denser's server, and only an answer from the parent window and origin counts: a
    token continues into Element's token login (/?loginToken=…, as the SSO ends), keeping the
    room in Element's fragment; the session page's own URL, kept in history, never carries it.
    The parent origin is the one the widget names in `parent` (window.location.origin), when the
    frame's referrer, if the browser sends one, is a page of it: a page of another origin framing
    this one gets no request and its answer is ignored, unless it names itself and withholds the
    referrer, which the server's frame-ancestors still stops. Without a token, a parent origin or
    an answer in time, sign in through Synapse's SSO, which goes through denser's OAuth server
    and comes back to Element with a login token the same way.
  Without a user (denser signed out, or switched account) it only clears Element's storage.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Chat</title>
</head>
<body>
<p id="status" style="font-family: sans-serif; color: #666">…</p>
<script>
(async () => {
  // Element's own keys (matrix-react-sdk Lifecycle): its signed-in user, and the homeserver its
  // token login (?loginToken=) uses, which it otherwise only stores when it starts the SSO itself
  const USER_ID_KEY = 'mx_user_id';
  const SSO_HOMESERVER_KEY = 'mx_sso_hs_url';
  // Element's device-level settings (DeviceSettingsHandler): a JSON object of setting values. Its
  // ThemeWatcher takes an explicit device-level use_system_theme, then theme, over account and
  // config settings.
  const LOCAL_SETTINGS_KEY = 'mx_local_settings';
  const THEMES = ['light', 'dark'];
  // For browsers without indexedDB.databases()
  const ELEMENT_DATABASES = [
    'matrix-js-sdk:riot-web-sync',
    'matrix-js-sdk:crypto',
    'matrix-js-sdk::matrix-sdk-crypto',
    'matrix-js-sdk::matrix-sdk-crypto-meta',
    'matrix-react-sdk'
  ];
  const USER_ID = /^@[a-z0-9._=\-/+]+:[A-Za-z0-9.\-]+(:[0-9]+)?$/;
  const IDP_ID = /^[A-Za-z0-9._~-]{1,255}$/;
  // A room alias (#) or ID (!) on a server
  const ROOM = /^[#!][^\s:#/?]+:[A-Za-z0-9.\-]+(:[0-9]+)?$/;
  const LOGIN_TOKEN_REQUEST = 'denser-matrix-login-token-request';
  const LOGIN_TOKEN_ANSWER = 'denser-matrix-login-token';
  // Synapse's login tokens are URL-safe; anything else is not one
  const LOGIN_TOKEN = /^[A-Za-z0-9._~+/=-]{1,1024}$/;
  // Past denser's bound on minting one, so a slow mint falls back to the SSO
  const LOGIN_TOKEN_WAIT_MS = 8000;

  const status = (text) => {
    document.getElementById('status').textContent = text;
  };

  const deleteDatabase = (name) =>
    new Promise((resolve) => {
      const request = indexedDB.deleteDatabase(name);
      // Blocked: an Element tab still has it open; it is deleted once that tab lets go
      request.onsuccess = request.onerror = request.onblocked = resolve;
    });

  async function clearElementStorage() {
    localStorage.clear();
    sessionStorage.clear();
    const listed = indexedDB.databases ? (await indexedDB.databases()).map(({ name }) => name) : [];
    const names = new Set([...listed, ...ELEMENT_DATABASES].filter(Boolean));
    await Promise.all([...names].map(deleteDatabase));
  }

  function storedLocalSettings() {
    try {
      const settings = JSON.parse(localStorage.getItem(LOCAL_SETTINGS_KEY));
      return settings && typeof settings === 'object' && !Array.isArray(settings) ? settings : {};
    } catch {
      // Not JSON, which Element could not read either: start from no settings
      return {};
    }
  }

  function setElementTheme(theme) {
    if (!theme) return;
    const settings = { ...storedLocalSettings(), theme, use_system_theme: false };
    localStorage.setItem(LOCAL_SETTINGS_KEY, JSON.stringify(settings));
  }

  // `named`, the parent's origin as the widget names it, if it is one and the referrer, when the
  // browser sent one, is a page of it; else ''
  function parentOrigin(named) {
    let origin;
    try {
      origin = new URL(named).origin;
    } catch {
      return '';
    }
    if (origin !== named || !/^https?:/.test(origin)) return '';
    if (document.referrer && new URL(document.referrer).origin !== origin) return '';
    return origin;
  }

  // The login token the parent page at `origin` answers with, or '' for none, no parent or
  // origin, or no answer in time
  function loginTokenFromParent(user, origin) {
    if (window.parent === window || !origin) return Promise.resolve('');
    return new Promise((resolve) => {
      const done = (token) => {
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        resolve(token);
      };
      const onMessage = (event) => {
        if (event.source !== window.parent || event.origin !== origin || event.data?.type !== LOGIN_TOKEN_ANSWER) {
          return;
        }
        const token = event.data.loginToken;
        done(typeof token === 'string' && LOGIN_TOKEN.test(token) ? token : '');
      };
      const timer = setTimeout(() => done(''), LOGIN_TOKEN_WAIT_MS);
      window.addEventListener('message', onMessage);
      // Not secret, but only for the parent origin: another page framing this one gets nothing
      window.parent.postMessage({ type: LOGIN_TOKEN_REQUEST, user }, origin);
    });
  }

  async function homeserverUrl() {
    const response = await fetch('/config.json', { cache: 'no-store' });
    const config = await response.json();
    return config.default_server_config['m.homeserver'].base_url.replace(/\/+$/, '');
  }

  const params = new URLSearchParams(location.search);
  const expectedUser = params.get('user') || '';
  const idp = params.get('idp') || '';
  const room = params.get('room') || '';
  const theme = params.get('theme') || '';
  const parent = parentOrigin(params.get('parent') || '');

  if (!expectedUser) {
    await clearElementStorage();
    status('Signed out of chat.');
    return;
  }
  if (!USER_ID.test(expectedUser) || !IDP_ID.test(idp) || (room && !ROOM.test(room)) || (theme && !THEMES.includes(theme))) {
    status('Invalid chat sign-in request.');
    return;
  }
  // Element's screen for a room; Synapse keeps the fragment when it adds the login token
  const roomScreen = room ? `#/room/${encodeURIComponent(room)}` : '';
  const elementUrl = `${location.origin}/${roomScreen}`;
  if (localStorage.getItem(USER_ID_KEY) === expectedUser) {
    setElementTheme(theme);
    location.replace(elementUrl);
    return;
  }

  // Asked for while the storage is cleared
  const loginToken = loginTokenFromParent(expectedUser, parent);
  await clearElementStorage();
  setElementTheme(theme);
  try {
    const homeserver = await homeserverUrl();
    localStorage.setItem(SSO_HOMESERVER_KEY, homeserver);
    const token = await loginToken;
    if (token) {
      location.replace(`${location.origin}/?loginToken=${encodeURIComponent(token)}${roomScreen}`);
      return;
    }
    const sso = new URL(`${homeserver}/_matrix/client/v3/login/sso/redirect/${encodeURIComponent(idp)}`);
    sso.searchParams.set('redirectUrl', elementUrl);
    location.replace(sso.toString());
  } catch (error) {
    status('Chat is unavailable: ' + error);
  }
})();
</script>
</body>
</html>

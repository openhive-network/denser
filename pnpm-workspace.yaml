packages:
  - 'apps/*'
  - 'packages/*'

# Version pins come from common-ci-configuration's catalogs (npm-common-config
# submodule): `python3 npm-common-config/scripts/python/pnpm-catalog-sync.py`
# rewrites the marked region below, and package.json files reference them only as
# `catalog:<name>`. Catalogs for packages ccc does not cover go after the region.
catalogs:
  # BEGIN common-ci-configuration catalogs (pnpm-catalog-sync.py rewrites this region from the ccc submodule; do not edit)
  "rollup-toolset":
    "rollup": "4.24.0"
    "rollup-plugin-copy": "3.5.0"
    "rollup-plugin-dts": "6.5.1"
    "@rollup/plugin-commonjs": "27.0.0"
    "@rollup/plugin-node-resolve": "15.3.1"
    "@rollup/plugin-replace": "6.0.2"
  "typedoc-toolset":
    "typedoc": "0.28.20"
    "typedoc-gitlab-wiki-theme": "2.1.1"
    "typedoc-plugin-markdown": "4.14.0"
  "typescript-toolset":
    "typescript": "6.0.3"
    "tslib": "2.8.1"
    "tsx": "4.23.15"
  "proto-toolset":
    "protobufjs": "7.2.5"
    "ts-proto": "1.172.0"
  "playwright-toolset":
    "@playwright/test": "1.64.1"
    "playwright": "1.64.1"
    "http-server": "14.1.1"
  "husky":
    "husky": "9.1.5"
  "terser":
    "terser": "5.39.0"
  "size-limit-toolset":
    "size-limit": "11.1.6"
    "@size-limit/file": "11.1.6"
  "hiveio-toolset":
    "@hiveio/wax": "1.28.8-stable.261028191145"
    "@hiveio/wax-signers-external": "1.28.8-stable.261028191145"
    "@hiveio/wax-signers-keychain": "1.28.8-stable.261028191145"
    "@hiveio/wax-signers-metamask": "1.28.8-stable.261028191145"
    "@hiveio/wax-signers-peakvault": "1.28.8-stable.261028191145"
    "@hiveio/wax-signers-beekeeper": "1.28.8-stable.261028191145"
    "@hiveio/beekeeper": "1.28.9-rc0-stable.261028200530"
    "@hiveio/workerbee": "1.28.4-rc1-stable.261029021233"
    "@hiveio/hb-auth": "1.28.4-rc0-stable.261028220752"
    "@hiveio/healthchecker-component": "2.0.2-stable.261027010535"
  "react-toolset":
    "react": "19.3.1"
    "react-dom": "19.3.1"
    "@types/react": "19.3.0"
    "@types/react-dom": "19.3.0"
    "next": "16.4.1"
    "eslint-config-next": "16.4.1"
    "@tanstack/react-query": "5.104.2"
  "vue-toolset":
    "vue": "3.5.44"
    "nuxt": "4.6.1"
    "pinia": "4.1.0"
    "vuetify": "4.2.5"
    "vue-tsc": "3.3.13"
  "tailwind-toolset":
    "tailwindcss": "4.3.3"
    "@tailwindcss/postcss": "4.3.3"
    "@tailwindcss/vite": "4.3.3"
    "@tailwindcss/cli": "4.3.3"
  # END common-ci-configuration catalogs

# wax-signers-external and wax-signers-beekeeper pin an older @hiveio/beekeeper
# whose embind glue uses new Function, which the nonce CSP (no 'unsafe-eval') blocks
# on the page; every consumer gets the catalog's CSP-safe build.
overrides:
  # BEGIN common-ci-configuration overrides (pnpm-catalog-sync.py rewrites this region from the ccc submodule; do not edit)
  "@hiveio/beekeeper": "catalog:hiveio-toolset"
  # END common-ci-configuration overrides

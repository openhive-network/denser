stages:
- build
- replay-and-sync
- test-e2e-stable
- test
- test-report-aggregate
- deploy
- publish
- cleanup

variables:
  # Variables required by Common CI jobs
  CI_COMMON_JOB_VERSION: '9f5e12cd984bf12746ce9af081868e09ced8068f'
  DOCKER_BUILDER_TAG: '$CI_COMMON_JOB_VERSION'
  DOCKER_DIND_TAG: '$CI_COMMON_JOB_VERSION'
  IMAGE_REMOVER_TAG: '$CI_COMMON_JOB_VERSION'

  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: none
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/clean/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

  # Runner feature flags
  FF_ENABLE_JOB_CLEANUP: 1


  # HAF API node configuration
  API_NODE_VERSION: '1.27.8'
  API_NODE_TAG: 'denser-11'
  HAF_IMAGE_REGISTRY: 'registry.gitlab.syncad.com/hive/haf/mirrornet-instance'
  HAF_IMAGE_NAME: '${HAF_IMAGE_REGISTRY}:${API_NODE_VERSION}'
  BLOCK_LOG_VERSION: 'f8a89045'
  # BLOCK_LOG_SOURCE_DIR: "/blockchain/block_log_mirror_44"
  REPLAY_DIRECTORY_PREFIX: '/cache/replay_data_denser_haf_api_node'
  REPLAY_DIRECTORY: '${REPLAY_DIRECTORY_PREFIX}_${API_NODE_TAG}_${API_NODE_VERSION}_${BLOCK_LOG_VERSION}'
  REPLAY_PIPELINE_DIRECTORY: '${REPLAY_DIRECTORY_PREFIX}_${CI_PIPELINE_ID}'
  DOCKER_TLS_CERTDIR: '${REPLAY_PIPELINE_DIRECTORY}_certs'
  BLOCK_LOG_SOURCE: '${REPLAY_PIPELINE_DIRECTORY}_block_log'
  BLOCK_LOG_SOURCE_DIR: '${BLOCK_LOG_SOURCE}'

  # NFS cache configuration for sync data sharing across builders
  DATA_CACHE_NFS_PREFIX: '/nfs/ci-cache'

  # Other settings
  CADDY_TAG: '2.7.6'
  PLAYWRIGHT_TAG: 'v1.49.1-jammy'

  HAF_COMMIT: 222c848355efbdf0e4970c5f384b6da7cbfb582e
include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
- project: 'hive/common-ci-configuration'
  ref: develop
  file:
  - '/templates/base.gitlab-ci.yml'
  - '/templates/docker_image_jobs.gitlab-ci.yml'
  - '/templates/cache_cleanup.gitlab-ci.yml'
- project: 'hive/haf'
  ref: 222c848355efbdf0e4970c5f384b6da7cbfb582e  # develop
  file: '/scripts/ci-helpers/prepare_data_image_job.yml'
- project: 'hive/hive'
  ref: 10ac0ce94f7591b6ad80db1a23d046c9d57b6559
  file: '/scripts/ci-helpers/extended_block_log_creation.gitlab-ci.yml'
- project: 'hive/haf_api_node'
  ref: d22ca041ec57cffa4531a030cc03175e73124cc3
  file: 'ci/node-replay.gitlab-ci.yml'

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
    - |
      (
      cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
      echo "pre_get_sources: checking $(pwd) for corrupt git state"
      if [ -d ".git" ]; then
        # Remove stale lock files that block git operations
        find .git -name "*.lock" -delete 2>/dev/null || true
        # Clean up removed haf submodule state (submodule was removed but old workspaces may have residual state)
        rm -rf .git/modules/haf haf 2>/dev/null || true

        # Check if main repo is corrupt - if so, remove .git to force fresh clone
        if ! git rev-parse HEAD >/dev/null 2>&1; then
          echo "pre_get_sources: main repository corrupt, forcing fresh clone"
          rm -rf .git
        else
          # Main repo OK - check and clean corrupt submodules
          # Check both the working dir and .git/modules/ since either can be corrupt
          if [ -f ".gitmodules" ]; then
            git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
              needs_clean=false
              [ -z "$submod" ] && continue
              # Check if submodule working directory exists but is corrupt
              if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                  needs_clean=true
                fi
              fi
              # Check if .git/modules exists but is corrupt (even if working dir is gone)
              if [ -d ".git/modules/$submod" ]; then
                if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                  echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                  needs_clean=true
                fi
              fi
              if [ "$needs_clean" = true ]; then
                echo "pre_get_sources: cleaning corrupt submodule: $submod"
                rm -rf "$submod" ".git/modules/$submod"
              fi
            done
          fi
          echo "pre_get_sources: existing repo OK"
        fi
      else
        echo "pre_get_sources: no .git directory (fresh workspace)"
      fi
      )

.docker_build_template:
  extends: .docker_image_builder_job_template
  stage: build
  interruptible: true
  variables:
    # DEPLOYMENT_ENV_FILE: Override in child jobs to source env vars from a file
    # e.g., DEPLOYMENT_ENV_FILE: "MAINNET_DEV_DEPLOYMENT_ENV"
    DEPLOYMENT_ENV_FILE: ""
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  script:
  - |
    # Source env vars from deployment file if specified
    if [[ -n "${DEPLOYMENT_ENV_FILE}" ]]; then
      # GitLab file variables: variable name contains path to file
      ENV_FILE_PATH="${!DEPLOYMENT_ENV_FILE}"
      if [[ -f "${ENV_FILE_PATH}" ]]; then
        echo "Sourcing build env vars from ${DEPLOYMENT_ENV_FILE}..."
        set -a  # auto-export all variables
        source "${ENV_FILE_PATH}"
        set +a
      else
        echo "Warning: DEPLOYMENT_ENV_FILE specified but file not found: ${ENV_FILE_PATH}"
      fi
    fi
  - |
    # Set PUSH_TO_HIVE_BLOG for protected tags matching pattern
    if [[ "${CI_COMMIT_TAG}" =~ ^[v01].* ]] && [[ "${CI_COMMIT_REF_PROTECTED}" == "true" ]]; then
      export PUSH_TO_HIVE_BLOG="true"
      echo "Will push to registry-upload.hive.blog for protected tag ${CI_COMMIT_TAG}"
      # Login to registry-upload.hive.blog
      docker login -u "$BLOG_REGISTRY_USER" -p "$BLOG_REGISTRY_PASSWORD" registry-upload.hive.blog
    fi
  - |
    # Create a default env file in case the build fails
    echo "${TURBO_APP_NAME}_IMAGE_NAME=${CI_REGISTRY_IMAGE}/${TURBO_APP_NAME}:${CI_COMMIT_SHA}" > ${TURBO_APP_NAME}-docker-build.env
    scripts/ci-helpers/docker-build-template-script.sh
  artifacts:
    paths:
    - ${TURBO_APP_NAME}-docker-build.env
    reports:
      dotenv: ${TURBO_APP_NAME}-docker-build.env
    when: always # This ensures artifacts are created even if job fails
  tags:
  - public-runner-docker

mirrornet-haf-binaries-extraction:
  extends: .job-defaults
  stage: build
  allow_failure: true
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: ['']
  variables:
    BINARY_CACHE_PATH: '${CI_PROJECT_DIR}/hived-mirrornet-binaries'
    GIT_SUBMODULE_STRATEGY: none
  script: 'cp --recursive /home/hived/bin ${BINARY_CACHE_PATH}'
  artifacts:
    when: on_success
    paths:
    - '${BINARY_CACHE_PATH}'
  tags:
  - public-runner-docker

# helper job just to prepare extended version of production image additionally holding .env file specific to test environment
.docker-build-testenv-image:
  extends: .docker_image_builder_job_template
  variables:
    TURBO_APP_NAME: ""
    BASE_IMAGE_NAME: ""
    ENV_FILE_PATHNAME: "./apps/${TURBO_APP_NAME}/.env.testing"
    IMAGE_SUFFIX: "testenv"
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"

    export NEW_IMAGE_TAGNAME="${CI_REGISTRY_IMAGE}/${TURBO_APP_NAME}-${IMAGE_SUFFIX}:${CI_COMMIT_SHA}"

    docker buildx build \
      --push \
      -t "${NEW_IMAGE_TAGNAME}" -f- . << EOF
      FROM $BASE_IMAGE_NAME AS production
      COPY "${ENV_FILE_PATHNAME}" /app/apps/.env
    EOF
    echo "DENSER_${TURBO_APP_NAME^^}_IMAGE_NAME=${NEW_IMAGE_TAGNAME}" > docker-build-testenv-${TURBO_APP_NAME}-image.env
  artifacts:
    paths:
    - docker-build-testenv-${TURBO_APP_NAME}-image.env
    reports:
      dotenv: docker-build-testenv-${TURBO_APP_NAME}-image.env
    when: always # This ensures artifacts are created even if job fails
  tags:
  - public-runner-docker

# Blog builds - separate for main (prod) and develop (dev) with different env vars
docker-build-blog:
  extends: .docker_build_template
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    variables:
      DEPLOYMENT_ENV_FILE: "MAINNET_PROD_DEPLOYMENT_ENV"
  - if: $CI_COMMIT_BRANCH == "develop"
    variables:
      DEPLOYMENT_ENV_FILE: "MAINNET_DEV_DEPLOYMENT_ENV"
  - when: on_success  # Other branches: build without env file (no Sentry)
  variables:
    TURBO_APP_SCOPE: '@hive/blog'
    TURBO_APP_PATH: '/apps/blog'
    TURBO_APP_NAME: 'blog'

# Wallet builds - separate for main (prod) and develop (dev) with different env vars
docker-build-wallet:
  extends: .docker_build_template
  rules:
  - if: $CI_COMMIT_BRANCH == "main"
    variables:
      DEPLOYMENT_ENV_FILE: "MAINNET_PROD_DEPLOYMENT_ENV"
  - if: $CI_COMMIT_BRANCH == "develop"
    variables:
      DEPLOYMENT_ENV_FILE: "MAINNET_DEV_DEPLOYMENT_ENV"
  - when: on_success  # Other branches: build without env file (no Sentry)
  variables:
    TURBO_APP_SCOPE: '@hive/wallet'
    TURBO_APP_PATH: '/apps/wallet'
    TURBO_APP_NAME: 'wallet'

docker-build-blog-subdirectory:
  extends: .docker_build_template
  rules:
  - if: '$CI_COMMIT_TAG'             # Auto on tagged releases
  - when: manual                      # Manual trigger on branches/MRs
    allow_failure: true
  variables:
    TURBO_APP_SCOPE: '@hive/blog'
    TURBO_APP_PATH: '/apps/blog'
    TURBO_APP_NAME: 'blog-subdirectory'
    BASE_PATH: '/blog'

docker-build-wallet-subdirectory:
  extends: .docker_build_template
  rules:
  - if: '$CI_COMMIT_TAG'             # Auto on tagged releases
  - when: manual                      # Manual trigger on branches/MRs
    allow_failure: true
  variables:
    TURBO_APP_SCOPE: '@hive/wallet'
    TURBO_APP_PATH: '/apps/wallet'
    TURBO_APP_NAME: 'wallet-subdirectory'
    BASE_PATH: '/wallet'

docker-build-blog-testenv:
  extends: .docker-build-testenv-image
  stage: build
  needs:
  - docker-build-blog
  variables:
    TURBO_APP_NAME: 'blog'
    BASE_IMAGE_NAME: ${BLOG_IMAGE_NAME}

docker-build-wallet-testenv:
  extends: .docker-build-testenv-image
  stage: build
  needs:
  - docker-build-wallet
  variables:
    TURBO_APP_NAME: 'wallet'
    BASE_IMAGE_NAME: ${WALLET_IMAGE_NAME}

docker-build-blog-mirrornet-testenv:
  extends: .docker-build-testenv-image
  needs:
  - docker-build-blog
  variables:
    TURBO_APP_NAME: 'blog'
    BASE_IMAGE_NAME: ${BLOG_IMAGE_NAME}
    ENV_FILE_PATHNAME: "./apps/${TURBO_APP_NAME}/.env.mirrornet-testing"
    IMAGE_SUFFIX: "mirrornet-testenv"

docker-build-wallet-mirrornet-testenv:
  extends: .docker-build-testenv-image
  needs:
  - docker-build-wallet
  variables:
    TURBO_APP_NAME: 'wallet'
    BASE_IMAGE_NAME: ${WALLET_IMAGE_NAME}
    ENV_FILE_PATHNAME: "./apps/${TURBO_APP_NAME}/.env.mirrornet-testing"
    IMAGE_SUFFIX: "mirrornet-testenv"

# Hived binary built as a part of HAF requires an additional
# library to function. This library has to be extracted from
# the image and passed to job extended_block_log_creation.
library_extraction:
  rules:
  - when: never
  extends: .job-defaults
  stage: build
  allow_failure: true
  image:
    name: $HAF_IMAGE_NAME
    entrypoint: ['']
  needs:
  - job: 'mirrornet-haf-binaries-extraction'
    artifacts: true
  variables:
    BINARY_CACHE_PATH: '${CI_PROJECT_DIR}/hived-mirrornet-binaries'
  script: scripts/ci-helpers/library-extraction.sh
  artifacts:
    when: on_success
    paths:
    - '${BINARY_CACHE_PATH}'
  tags:
  - public-runner-docker

extended_block_log_creation:
  rules:
  - when: never
  extends: .extended_block_log_creation
  stage: build
  allow_failure: true
  needs:
  - job: 'mirrornet-haf-binaries-extraction'
    artifacts: true
  - job: 'library_extraction'
    artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: 'recursive'
    GIT_DEPTH: 0 # the BLOCK_LOG_VERSION currently points to a really old version
    REGISTRY: 'registry.gitlab.syncad.com/hive/hive'
    REGISTRY_USER: '${HIVED_CI_IMGBUILDER_USER}'
    REGISTRY_PASS: '${HIVED_CI_IMGBUILDER_PASSWORD}'
    IMAGE_TAG: '${BLOCK_LOG_VERSION}'
    HIVE_SRC: '${CI_PROJECT_DIR}/haf/hive'
    HIVE_COMMIT: '${BLOCK_LOG_VERSION}'
    BLOCK_LOG_SOURCE_DIR: '/blockchain/block_log_5m'
    BINARY_PATH: '${CI_PROJECT_DIR}/hived-mirrornet-binaries'
    LD_LIBRARY_PATH: '${BINARY_PATH}'
  tags:
  - public-runner-docker

block-log-extraction:
  rules:
  - when: never
  extends: .docker_image_builder_job_template
  stage: replay-and-sync
  allow_failure: true
  needs:
  - extended_block_log_creation
  variables:
    GIT_SUBMODULE_STRATEGY: 'recursive'
    BLOCK_LOG_DIRECTORY: '${REPLAY_PIPELINE_DIRECTORY}_block_log'
  script: scripts/ci-helpers/block-log-extraction.sh
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

block_log_processing:
  rules:
  - when: never
  extends: .job-defaults
  image: 'registry.gitlab.syncad.com/hive/hive/ci-base-image${TEST_IMAGE_TAG}'
  stage: replay-and-sync
  allow_failure: true
  needs:
  - mirrornet-haf-binaries-extraction
  - block-log-extraction
  variables:
    BLOCK_LOG_UTIL_PATH: '${CI_PROJECT_DIR}/hived-mirrornet-binaries/block_log_util'
  script: scripts/ci-helpers/block-log-processing.sh
  artifacts:
    reports:
      dotenv:
      - 'block_log_data.env'
    paths:
    - '*.log'
    - 'block_log_data.env'
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

mirrornet-haf-node-replay:
  rules:
  - when: never
  extends: .haf-node-replay
  stage: replay-and-sync
  timeout: 3 hours
  allow_failure: true
  needs:
  - mirrornet-haf-binaries-extraction
  - block_log_processing
  variables:
    GIT_STRATEGY: 'clone'
    CI_DEBUG_SERVICES: 'false' # Change to true to debug services in this job
    # LAST_BLOCK_NUMBER: "5004741"
    ARGUMENTS: '--chain-id=44 --skeleton-key=5JNHfZYKGaomSFvd4NUdQ9qMcEAC43kujbfjueTHpVapX1Kzq2n
      --replay-blockchain --stop-at-block ${LAST_BLOCK_NUMBER} --alternate-chain-spec=/home/hived/datadir/blockchain/alternate-chain-spec.json'
    # FAKETIME: "@2016-09-16 01:39:06"
    FAKETIME: ${HEAD_BLOCK_TIMESTAMP}
    ADDITIONAL_CONFIGURATION_SCRIPT: 'scripts/ci-helpers/copy-mirrornet-haf-config.sh'
    REPLAY_TIMEOUT: 9000
    HAF_IMAGE: ${HAF_IMAGE_REGISTRY}
    HIVE_API_NODE_VERSION: ${API_NODE_VERSION}
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

.node-job:
  extends: .job-defaults
  interruptible: true
  image:
    name: node:20.11.1-alpine3.18
    entrypoint: []
  stage: test
  before_script:
  - corepack enable
  - |
    # Retry corepack prepare with exponential backoff to handle transient npm registry failures
    max_attempts=5
    attempt=1
    delay=5
    while [ $attempt -le $max_attempts ]; do
      echo "Attempting to prepare pnpm (attempt $attempt/$max_attempts)..."
      if corepack prepare pnpm@9.6.0 --activate; then
        echo "Successfully prepared pnpm"
        break
      fi
      if [ $attempt -eq $max_attempts ]; then
        echo "Failed to prepare pnpm after $max_attempts attempts"
        exit 1
      fi
      echo "Attempt $attempt failed, retrying in ${delay}s..."
      sleep $delay
      attempt=$((attempt + 1))
      delay=$((delay * 2))
    done
  - pnpm config set store-dir .pnpm-store
  script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):deps[collapsed=true]\r\e[0KInstalling dependencies..."
    pnpm install --frozen-lockfile
    echo -e "\e[0Ksection_end:$(date +%s):deps\r\e[0K"
  cache:
    key: '$TURBO_APP_SCOPE-cache-2'
    paths:
    - .npm/
    - .pnpm-store/
    - .next/
  artifacts:
    name: '$CI_JOB_NAME-$CI_COMMIT_REF_NAME'
    when: always
    expire_in: 1 week
  tags:
  - public-runner-docker

renderer-unit-tests:
  extends: .node-job
  stage: test
  script:
  - !reference [.node-job, script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):renderer-tests[collapsed=false]\r\e[0KRunning renderer unit tests..."
    cd packages/renderer
    pnpm test
    echo -e "\e[0Ksection_end:$(date +%s):renderer-tests\r\e[0K"
  tags:
  - public-runner-docker

.e2e_tests_template:
  extends: .node-job
  image: mcr.microsoft.com/playwright:${PLAYWRIGHT_TAG}
  variables:
    CI_DEBUG_SERVICES: true
    FF_NETWORK_PER_BUILD: 1
    REACT_APP_API_ENDPOINT: https://api.hive.blog
    REACT_APP_IMAGES_ENDPOINT: https://images.hive.blog/
    DENSER_SERVER_ENV_DUMP: true
    DENSER_URL: https://caddy
  # parallel.matrix must be defined per-job (different browser sets)
  script:
  - !reference [.node-job, script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):tests[collapsed=false]\r\e[0KRunning tests..."
    cd .$TURBO_APP_PATH
    npx playwright test --project=$PROJECT --shard=$SHARD_INDEX/$SHARD_TOTAL --update-snapshots
    echo -e "\e[0Ksection_end:$(date +%s):tests\r\e[0K"
  artifacts:
    paths:
    - .${TURBO_APP_PATH}/playwright-report/
    - .${TURBO_APP_PATH}/test-results/
    - .${TURBO_APP_PATH}/junit/
    reports:
      junit: .${TURBO_APP_PATH}/junit/**/**/results.xml

mirrornet-replay-data-copy:
  rules:
  - when: never
  extends: .haf_api_node_replay_data_copy
  stage: test
  allow_failure: true
  needs:
  - mirrornet-haf-node-replay
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

mirrornet-based-tests:
  rules:
  - when: never
  extends:
  - .haf_api_node_test
  - .node-job
  needs:
  - mirrornet-haf-binaries-extraction
  - docker-build-blog-mirrornet-testenv
  - docker-build-wallet-mirrornet-testenv
  - mirrornet-replay-data-copy
  - block_log_processing
  image: 'mcr.microsoft.com/playwright:${PLAYWRIGHT_TAG}'
  allow_failure: true
  services:
  - !reference [.haf_api_node_test, services]
  - name: $DENSER_BLOG_IMAGE_NAME
    alias: denser-blog
    variables:
      HEALTHCHECK_TCP_PORT: '3000'
      PORT: '3000'
      REACT_APP_SITE_DOMAIN: 'https://caddy-blog.local'
      REACT_APP_WALLET_ENDPOINT: 'https://caddy-wallet'
      TURBO_APP_SCOPE: '@hive/blog'
      TURBO_APP_PATH: '/apps/blog'
  - name: caddy:${CADDY_TAG}
    alias: caddy-blog
    command:
    - caddy
    - reverse-proxy
    - --from=https://caddy-blog
    - --to=denser-blog:3000
    - --internal-certs
  - name: $DENSER_WALLET_IMAGE_NAME
    alias: denser-wallet
    variables:
      HEALTHCHECK_TCP_PORT: '4000'
      PORT: '4000'
      REACT_APP_SITE_DOMAIN: 'https://caddy-wallet.local'
      REACT_APP_BLOG_DOMAIN: 'https://caddy-blog'
      TURBO_APP_SCOPE: '@hive/wallet'
      TURBO_APP_PATH: '/apps/wallet'
  - name: caddy:${CADDY_TAG}
    alias: caddy-wallet
    command:
    - caddy
    - reverse-proxy
    - --from=https://caddy-wallet
    - --to=denser-wallet:4000
    - --internal-certs
  variables:
    GIT_STRATEGY: 'clone'
    CI_DEBUG_SERVICES: 'false'
    ARGUMENTS: '--chain-id=44 --skeleton-key=5JNHfZYKGaomSFvd4NUdQ9qMcEAC43kujbfjueTHpVapX1Kzq2n
      --alternate-chain-spec=/home/hived/datadir/blockchain/alternate-chain-spec.json'
    FAKETIME: ${HEAD_BLOCK_TIMESTAMP}
    HAF_IMAGE: ${HAF_IMAGE_REGISTRY}
    HIVE_API_NODE_VERSION: ${API_NODE_VERSION}
    REACT_APP_API_ENDPOINT: 'https://dind/'
    REACT_APP_IMAGES_ENDPOINT: 'https://images.hive.blog/'
    REACT_APP_CHAIN_ID: '44'
    REACT_APP_LOGGING_BROWSER_ENABLED: 'true'
    NODE_TLS_REJECT_UNAUTHORIZED: 0
  timeout: 3 hours
  script: scripts/ci-helpers/run-mirrornet-tests.sh
  after_script:
  - |
    cp "${REPLAY_PIPELINE_DIRECTORY}/docker_entrypoint.log" "${CI_PROJECT_DIR}/haf.log"
    cp --recursive "${REPLAY_PIPELINE_DIRECTORY}/logs" "${CI_PROJECT_DIR}/logs"
  cache:
    key: 'mirrornet-tests-1'
  artifacts:
    paths:
    - '*.log'
    - 'logs/'
    - '*.env'
    - '/apps/blog/playwright-report/'
    - './apps/blog/test-results/'
    - '/apps/blog/junit/'
    reports:
      junit: 'apps/blog/junit/results.xml'
  tags:
  - public-runner-docker
  - data-cache-storage
  - fast

e2e-tests-blog-stable:
